{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions — {{ test.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{
            --bg:#070a10;--surface:#0e1420;--surface-2:#111827;
            --border:#1c2535;--border-2:#263040;
            --text:#e2e8f4;--text-2:#7d8fa8;--text-3:#4a5568;
            --accent:#3ee5b0;--red:#f87171;--yellow:#f5c542;
            --mono:'Consolas','Courier New',monospace;--sans:'Inter',Arial,sans-serif;
        }
        body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}

        .topbar{
            position:sticky;top:0;z-index:50;height:58px;padding:0 32px;
            background:rgba(6,9,14,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
            border-bottom:1px solid var(--border);
            display:flex;align-items:center;justify-content:space-between;gap:16px;
        }
        .topbar-brand{font-family:var(--mono);font-size:15px;font-weight:800;color:var(--accent);}
        .topbar-sep{width:1px;height:20px;background:var(--border);}
        .topbar-title{font-size:14px;font-weight:600;color:#fff;}
        .topbar-link{
            font-size:13px;color:var(--text-2);text-decoration:none;font-family:var(--mono);
            transition:color 0.15s;
        }
        .topbar-link:hover{color:var(--accent);}

        .review-body{
            display:grid;grid-template-columns:1fr 240px;gap:22px;
            max-width:1100px;margin:28px auto;padding:0 28px 80px;
        }

        .question-card{
            background:var(--surface);border:1px solid var(--border);
            border-radius:16px;padding:30px;
            border-left:4px solid var(--border);
            transition:border-left-color 0.25s;
        }
        .question-card.correct-border{border-left-color:var(--accent);box-shadow:0 0 30px rgba(62,229,176,0.07);}
        .question-card.wrong-border{border-left-color:var(--red);box-shadow:0 0 30px rgba(248,113,113,0.07);}
        .question-card.unattempted-border{border-left-color:var(--yellow);}

        .q-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;}
        .q-number{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);}
        .q-text{font-size:18px;font-weight:600;color:#fff;line-height:1.55;margin-bottom:24px;}

        /* Markdown-rendered content */
        .q-text p{margin:0 0 10px;}
        .q-text p:last-child{margin-bottom:0;}
        .q-text strong{color:#fff;font-weight:700;}
        .q-text em{color:var(--text);}
        .q-text ul,.q-text ol{margin:8px 0 10px 22px;}
        .q-text li{margin-bottom:4px;}
        .q-text code{
            font-family:var(--mono);
            font-size:14px;
            background:rgba(62,229,176,0.08);
            border:1px solid rgba(62,229,176,0.15);
            padding:1.5px 6px;
            border-radius:4px;
            color:var(--accent);
        }
        .q-text pre{
            background:#060a12;
            border:1px solid var(--border);
            border-radius:8px;
            padding:14px 16px;
            margin:14px 0;
            overflow-x:auto;
            font-family:var(--mono);
            font-size:13.5px;
            line-height:1.55;
        }
        .q-text pre code{
            background:transparent;
            padding:0;
            border:none;
            color:inherit;
            font-size:inherit;
        }

        /* ---- Question image ---- */
        .q-text .q-diagram{
            display:block;
            max-width:100%;
            max-height:400px;
            margin:16px 0;
            border-radius:8px;
            border:1px solid var(--border);
            background:#060a12;
            padding:8px;
            object-fit:contain;
        }

        .options{display:flex;flex-direction:column;gap:10px;}
        .option{
            display:flex;align-items:center;justify-content:space-between;gap:12px;
            padding:13px 18px;
            background:#090e18;border:1px solid var(--border);border-radius:10px;
            font-size:14px;color:var(--text);line-height:1.5;
        }
        .option-left{display:flex;align-items:center;gap:12px;}
        .option-letter{
            width:26px;height:26px;border-radius:6px;
            background:var(--surface-2);border:1px solid var(--border);
            display:flex;align-items:center;justify-content:center;
            font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text-3);
            flex-shrink:0;
        }
        .option.selected-correct{border-color:var(--accent);background:rgba(62,229,176,0.08);}
        .option.selected-correct .option-letter{background:var(--accent);color:#04120d;border-color:var(--accent);}
        .option.selected-wrong{border-color:var(--red);background:rgba(248,113,113,0.08);}
        .option.selected-wrong .option-letter{background:var(--red);color:#fff;border-color:var(--red);}
        .option.correct-answer{border-color:rgba(62,229,176,0.4);}
        .option.correct-answer .option-letter{border-color:var(--accent);color:var(--accent);}

        .tag{
            font-family:var(--mono);font-size:10.5px;
            padding:3px 10px;border-radius:999px;font-weight:700;
            white-space:nowrap;letter-spacing:0.04em;flex-shrink:0;
        }
        .tag-correct{background:var(--accent);color:#04120d;}
        .tag-wrong{background:var(--red);color:#fff;}
        .tag-ref{background:rgba(62,229,176,0.12);color:var(--accent);border:1px solid rgba(62,229,176,0.25);}

        .explanation{
            margin-top:22px;padding:16px 20px;
            background:#090e18;border-radius:10px;
            border-left:3px solid var(--accent);
        }
        .explanation-title{
            font-family:var(--mono);font-size:10.5px;font-weight:700;
            color:var(--accent);text-transform:uppercase;letter-spacing:0.14em;margin-bottom:9px;
        }
        .explanation-text{font-size:14px;color:var(--text-2);line-height:1.6;}

        .explanation-text p{margin:0 0 8px;}
        .explanation-text p:last-child{margin-bottom:0;}
        .explanation-text code{
            font-family:var(--mono);
            font-size:13px;
            background:rgba(62,229,176,0.08);
            border:1px solid rgba(62,229,176,0.15);
            padding:1.5px 6px;
            border-radius:4px;
            color:var(--accent);
        }
        .explanation-text pre{
            background:#060a12;
            border:1px solid var(--border);
            border-radius:8px;
            padding:12px 14px;
            margin:12px 0;
            overflow-x:auto;
            font-family:var(--mono);
            font-size:13px;
            line-height:1.55;
        }
        .explanation-text pre code{
            background:transparent;
            padding:0;
            border:none;
            color:inherit;
            font-size:inherit;
        }

        .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px;}
        .nav-btn{
            display:inline-flex;align-items:center;gap:7px;
            padding:10px 22px;border-radius:999px;
            font-size:13.5px;font-weight:600;border:none;cursor:pointer;
            transition:all 0.17s;font-family:var(--sans);
        }
        .nav-btn-prev{background:var(--surface);color:var(--text);border:1px solid var(--border);}
        .nav-btn-prev:hover:not(:disabled){border-color:var(--border-2);color:#fff;}
        .nav-btn-next{background:var(--accent);color:#04120d;}
        .nav-btn-next:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 20px rgba(62,229,176,0.35);}
        .nav-btn:disabled{opacity:0.35;cursor:not-allowed;}
        .page-indicator{font-family:var(--mono);font-size:13px;color:var(--text-3);}

        .palette-card{
            background:var(--surface);border:1px solid var(--border);
            border-radius:16px;padding:20px;
            position:sticky;top:78px;height:fit-content;
        }
        .palette-title{font-size:11.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:13px;}
        .palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px;}
        .p-btn{
            aspect-ratio:1;border-radius:6px;
            font-size:10.5px;font-weight:600;cursor:pointer;
            display:flex;align-items:center;justify-content:center;
            border:1px solid var(--border);background:var(--surface-2);color:var(--text-3);
            transition:all 0.15s;
        }
        .p-btn:hover{border-color:var(--border-2);color:var(--text);}
        .p-btn.p-correct{background:rgba(62,229,176,0.12);border-color:rgba(62,229,176,0.3);color:var(--accent);}
        .p-btn.p-wrong{background:rgba(248,113,113,0.12);border-color:rgba(248,113,113,0.3);color:var(--red);}
        .p-btn.p-skip{background:rgba(245,197,66,0.10);border-color:rgba(245,197,66,0.25);color:var(--yellow);}
        .p-btn.p-current{box-shadow:0 0 0 2px var(--accent);}
        .legend-row{display:flex;flex-direction:column;gap:6px;}
        .legend-item{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-2);}
        .ldot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}

        @media(max-width:820px){.review-body{grid-template-columns:1fr;}.palette-card{position:static;}}
        ::-webkit-scrollbar{width:5px;} ::-webkit-scrollbar-track{background:var(--bg);}
        ::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px;}
    </style>
</head>
<body>

<div class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
        <span class="topbar-brand">P</span>
        <div class="topbar-sep"></div>
        <span class="topbar-title">{{ test.title }} — Review</span>
    </div>
    <a href="{% url 'mocktests:test_analysis' attempt.id %}" class="topbar-link">← Back to Analysis</a>
</div>

<div class="review-body">

    <div>
        <div class="question-card" id="question-card">
            <div class="q-meta">
                <div class="q-number" id="question-number"></div>
                <div style="display:flex;gap:8px;" id="q-status-tags"></div>
            </div>
            <div class="q-text" id="question-text"></div>
            <div class="options">
                <div class="option" id="option-A">
                    <div class="option-left"><span class="option-letter">A</span><span id="option-A-text"></span></div>
                    <span id="option-A-tag"></span>
                </div>
                <div class="option" id="option-B">
                    <div class="option-left"><span class="option-letter">B</span><span id="option-B-text"></span></div>
                    <span id="option-B-tag"></span>
                </div>
                <div class="option" id="option-C">
                    <div class="option-left"><span class="option-letter">C</span><span id="option-C-text"></span></div>
                    <span id="option-C-tag"></span>
                </div>
                <div class="option" id="option-D">
                    <div class="option-left"><span class="option-letter">D</span><span id="option-D-text"></span></div>
                    <span id="option-D-tag"></span>
                </div>
            </div>
            <div class="explanation" id="explanation-block">
                <div class="explanation-title">Explanation</div>
                <div class="explanation-text" id="explanation-text"></div>
            </div>
        </div>

        <div class="nav-row">
            <button class="nav-btn nav-btn-prev" id="prev-btn">← Previous</button>
            <span class="page-indicator" id="page-indicator"></span>
            <button class="nav-btn nav-btn-next" id="next-btn">Next →</button>
        </div>
    </div>

    <div class="palette-card">
        <div class="palette-title">Question Palette</div>
        <div class="palette-grid" id="palette-grid"></div>
        <div class="legend-row">
            <div class="legend-item"><div class="ldot" style="background:rgba(62,229,176,0.4);"></div>Correct</div>
            <div class="legend-item"><div class="ldot" style="background:rgba(248,113,113,0.4);"></div>Wrong</div>
            <div class="legend-item"><div class="ldot" style="background:rgba(245,197,66,0.4);"></div>Skipped</div>
        </div>
    </div>

</div>

{{ review_data|json_script:"review-data" }}
<script src="{% static 'mocktests/js/test_questions.js' %}"></script>
</body>
</html>
